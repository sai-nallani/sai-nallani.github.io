<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif">
  <title>Four reference frames, side view</title>
  <desc>World axes sit at the table corner. Planar scene axes sit at the objects and stay upright. SE(3) gripper axes sit at the hand and tilt with it. Planar gripper axes sit at the hand but stay upright.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34665e"/>
    </marker>
    <g id="scene">
      <line x1="16" y1="170" x2="224" y2="170" stroke="#aaa399" stroke-width="1.5"/>
      <path d="M78 156 Q97 178 116 156 Z" fill="#d9d2c8" stroke="#77716b"/>
      <ellipse cx="168" cy="167" rx="26" ry="3.5" fill="#d9d2c8" stroke="#77716b"/>
    </g>
    <g id="hand">
      <path d="M0 -26 V0 M-13 0 H13 M-13 0 V17 M13 0 V17" fill="none" stroke="#6b6b6b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="axes">
      <line x1="0" y1="0" x2="38" y2="0" stroke="#34665e" stroke-width="2" marker-end="url(#head)"/>
      <line x1="0" y1="0" x2="0" y2="-38" stroke="#34665e" stroke-width="2" marker-end="url(#head)"/>
      <circle r="3" fill="#34665e"/>
      <text x="42" y="4" font-size="11" fill="#34665e">x</text>
      <text x="-3" y="-44" font-size="11" fill="#34665e">z</text>
    </g>
    <g id="yaw">
      <ellipse cx="0" cy="-30" rx="11" ry="3.5" fill="none" stroke="#34665e" stroke-width="1.2" stroke-dasharray="3 2"/>
    </g>
  </defs>

  <rect width="480" height="420" fill="#faf9f6"/>

  <!-- World -->
  <g transform="translate(0 0)">
    <text x="16" y="26" font-size="14" fill="#2c2c2c" font-weight="600">World</text>
    <text x="16" y="44" font-size="11" fill="#6b6b6b">Fixed simulator axes</text>
    <use href="#scene"/>
    <use href="#hand" transform="translate(150 96) rotate(-25)"/>
    <use href="#axes" transform="translate(28 170)"/>
  </g>

  <!-- Planar scene -->
  <g transform="translate(240 0)">
    <text x="16" y="26" font-size="14" fill="#2c2c2c" font-weight="600">Planar scene</text>
    <text x="16" y="44" font-size="11" fill="#6b6b6b">At the objects; turns with yaw</text>
    <use href="#scene"/>
    <use href="#hand" transform="translate(150 96) rotate(-25)"/>
    <use href="#axes" transform="translate(128 162)"/>
    <use href="#yaw" transform="translate(128 162)"/>
  </g>

  <!-- SE(3) gripper -->
  <g transform="translate(0 210)">
    <text x="16" y="26" font-size="14" fill="#2c2c2c" font-weight="600">SE(3) gripper</text>
    <text x="16" y="44" font-size="11" fill="#6b6b6b">At the hand; tilts with it</text>
    <use href="#scene"/>
    <use href="#hand" transform="translate(150 96) rotate(-25)"/>
    <use href="#axes" transform="translate(150 96) rotate(-25)"/>
  </g>

  <!-- Planar gripper -->
  <g transform="translate(240 210)">
    <text x="16" y="26" font-size="14" fill="#2c2c2c" font-weight="600">Planar gripper</text>
    <text x="16" y="44" font-size="11" fill="#6b6b6b">At the hand; stays upright</text>
    <use href="#scene"/>
    <use href="#hand" transform="translate(150 96) rotate(-25)"/>
    <use href="#axes" transform="translate(150 96)"/>
    <use href="#yaw" transform="translate(150 96)"/>
  </g>

  <line x1="240" y1="16" x2="240" y2="404" stroke="#e8e4df"/>
  <line x1="16" y1="210" x2="464" y2="210" stroke="#e8e4df"/>
</svg>
